<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum | RheinAgent</title>
<meta name="description" content="Impressum von RheinAgent, Timmy Becker, Köln.">
<meta name="theme-color" content="#0d2740">
<style>
:root{--navy:#0d2740;--navy2:#143a5c;--blue:#1f6fb2;--green:#2f9e63;--ink:#18283a;--muted:#5a6876;--line:#dde4ea;--bg:#f4f7fa;--card:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
a:focus-visible,.btn:focus-visible{outline:3px solid #8cc0ea;outline-offset:3px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;font-size:1.15rem;letter-spacing:.2px}
.brand svg{width:30px;height:30px}
.nav a{color:#cfe3f5;text-decoration:none;margin-left:20px;font-size:.95rem}
.nav a:hover{color:#fff}
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:relative;overflow:hidden}
.hero .inner{padding:56px 0 110px}
.eyebrow{display:inline-block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#8fd3ad;font-weight:600;margin-bottom:14px}
h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1.15;margin:0 0 16px;font-weight:750;letter-spacing:-.01em;max-width:18ch}
.lead{font-size:1.15rem;color:#d3e4f3;max-width:56ch;margin:0 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 20px;border-radius:8px;font-weight:600;text-decoration:none;font-size:1rem}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:#278552}
.btn.ghost{border:1px solid #6f93b3;color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:70px;display:block}
section{padding:54px 0 6px}
h2{font-size:1.6rem;line-height:1.25;margin:0 0 8px;letter-spacing:-.005em}
.sub{color:var(--muted);margin:0 0 24px;max-width:60ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 2px rgba(13,39,64,.04)}
.card h3{margin:12px 0 6px;font-size:1.1rem}
.card p{margin:0;color:var(--muted);font-size:.98rem}
.ico{width:44px;height:44px;border-radius:10px;background:#e6f1fa;display:grid;place-items:center}
.ico svg{width:24px;height:24px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.card{display:block;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
a.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(13,39,64,.1);border-color:#bcd0e0}
a.card:focus-visible{outline:3px solid #8cc0ea;outline-offset:3px}
.more{display:inline-block;margin-top:14px;color:var(--blue);font-weight:600;font-size:.95rem}
.books{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.book{display:flex;gap:16px;align-items:stretch}
.cover{flex:0 0 92px;border-radius:6px;background:linear-gradient(170deg,#0d2740,#1f6fb2);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;min-height:132px}
.cover b{display:block;font-size:.95rem;letter-spacing:.02em;line-height:1.15;margin-bottom:4px}
.cover.two{background:linear-gradient(170deg,#143a5c,#2f9e63)}
.cover.three{background:linear-gradient(170deg,#1b2f45,#8a5a2b)}
.book .t{display:flex;flex-direction:column;justify-content:center}
.book .t h3{margin:0 0 2px}
.band{background:var(--navy);color:#fff;border-radius:14px;padding:28px;margin-top:54px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.band p{margin:0;color:#d3e4f3;max-width:48ch}
.band strong{color:#fff;font-size:1.15rem;display:block;margin-bottom:4px}
footer{margin-top:64px;border-top:1px solid var(--line);padding:24px 0 44px;color:var(--muted);font-size:.92rem}
footer .row{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
footer a{color:var(--muted)}
.legal{padding:40px 0 10px}
.legal .doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 30px;max-width:720px}
.legal h1{color:var(--ink);font-size:2rem;max-width:none}
.legal h2{font-size:1.1rem;margin:22px 0 4px}
.legal p{margin:0 0 6px}
@media(max-width:560px){.nav a{margin-left:14px}.hero .inner{padding:36px 0 96px}.book{flex-direction:row}.legal .doc{padding:22px 18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<main class="wrap legal">
<div class="doc">
<h1>Impressum</h1>
<h2>Angaben gemäß § 5 DDG</h2>
<p>Timmy Becker<br>RheinAgent<br>Saarstraße 25<br>50996 Köln</p>
<h2>Kontakt</h2>
<p>E-Mail: <a href="mailto:rheinagentmcp@gmail.com">rheinagentmcp@gmail.com</a></p>
</div>
</main>

</body>
</html>
